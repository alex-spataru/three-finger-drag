name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit shellcheck

      - name: Lint shell scripts
        run: |
          bash -n install.sh uninstall.sh
          shellcheck -S style install.sh uninstall.sh

      - name: Check Lua syntax
        run: luajit -bl 50-three-finger-drag.lua >/dev/null

      - name: Run plugin tests
        run: luajit tests/run.lua

      - name: Check for non-ASCII characters
        run: |
          if grep -rnP '[^\x00-\x7F]' --include='*.lua' --include='*.sh' --include='*.md' --include='*.yml' . ; then
            echo "non-ASCII characters found" >&2
            exit 1
          fi
